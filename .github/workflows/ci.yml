name: integrity

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline-integrity:
    name: Pipeline integrity
    runs-on: ubuntu-latest
    env:
      NXF_DISABLE_CHECK_LATEST: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Nextflow 25
        uses: nf-core/setup-nextflow@v1
        with:
          version: '25.10.0'

      - name: Validate Nextflow profiles
        run: |
          for profile in test; do
            nextflow config -flat . -profile "$profile" > /dev/null
          done

      # INFO: PREDICT pins its image tag (src/modules/predict/main.nf). Building that tag here makes
      # INFO: the tests and the end-to-end run use this revision's predict.py and model instead of a
      # INFO: published image.
      - name: Build the PREDICT image of this revision
        run: |
          image=$(grep -o "ghcr.io/hillerlab/orf-predict:[^']*" src/modules/predict/main.nf)
          docker build -f containers/predict/predict.Dockerfile -t "$image" .
          echo "PREDICT_IMAGE=$image" >> "$GITHUB_ENV"

      - name: PREDICT unit tests in the image
        run: |
          docker run --rm -v "$PWD/modules/predict:/src:ro" -w /src "$PREDICT_IMAGE" \
            python -m unittest model_test.py blast_schema_test.py

      - name: Run default end-to-end smoke test
        timeout-minutes: 30
        run: assets/scripts/e2e.sh test
